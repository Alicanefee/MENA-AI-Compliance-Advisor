# Registry of official legal sources.
#
# Each source is downloaded by `scripts/fetch_laws.py`, converted to text and
# split into article-level passages by `scripts/build_index.py`.
#
# urls        tried in order; the first response that is a PDF or HTML document wins
# manual_url  page to open in a browser when automated download is blocked;
#             save the file as data/laws/raw/<id>.pdf (or .html) and rerun build_index
# trim        optional cut of the extracted text, e.g. to drop an appended regulation
# extraction  "ai" when the PDF layout defeats text extraction (see scripts/ai_extract.py);
#             until the AI transcription exists the source is indexed page by page
# notes       caveats shown next to every passage from this source

sources:
  - id: uae_labour_law
    jurisdiction: AE
    title: "UAE Federal Decree-Law No. 33 of 2021 on the Regulation of Labour Relations (with amendments)"
    short: "UAE Labour Law"
    kind: law
    language: en
    urls:
      - "https://www.mohre.gov.ae/assets/download/e82f7872/Federal%20Decree-Law%20No.%2033%20of%202021%20Regarding%20the%20Regulation%20of%20Employment%20Relationship%20and%20its%20amendments_638990571068264034.pdf.aspx"
    manual_url: "https://uaelegislation.gov.ae/en/legislations/1541"
    trim:
      # The MOHRE compilation appends Cabinet Resolution No. 1 of 2022 (the
      # implementing regulation), whose article numbers restart at 1.
      end_marker: "Cabinet Resolution No. (1)"
      occurrence: 2
    # Two book pages per PDF page with article headings printed after their text:
    # the text layer cannot be mapped to article numbers reliably.
    extraction: ai
    notes: "Official English translation published by MOHRE; the Arabic text prevails."

  - id: uae_pdpl
    jurisdiction: AE
    title: "UAE Federal Decree-Law No. 45 of 2021 on the Protection of Personal Data"
    short: "UAE PDPL"
    kind: law
    language: en
    urls:
      - "https://uaelegislation.gov.ae/en/legislations/1972/download"
    manual_url: "https://uaelegislation.gov.ae/en/legislations/1972"
    notes: "Official English translation; the Arabic text prevails. Does not apply to DIFC/ADGM, which have their own data protection laws."

  - id: uae_ai_charter
    jurisdiction: AE
    title: "The UAE Charter for the Development and Use of Artificial Intelligence (2024)"
    short: "UAE AI Charter"
    kind: guidance
    language: en
    urls:
      - "https://u.ae/en/about-the-uae/strategies-initiatives-and-awards/policies/Ai/The-UAE-Charter-for-the-Development-and-Use-of-Artificial-Intelligence"
    manual_url: "https://uaelegislation.gov.ae/en/policy/details/the-uae-charter-for-the-development-and-use-of-artificial-intelligence"
    notes: "Policy charter, not a statute. Principles are not directly enforceable obligations."

  - id: sa_labour_law
    jurisdiction: SA
    title: "Saudi Labor Law, Royal Decree No. M/51 (2005)"
    short: "Saudi Labor Law"
    kind: law
    language: en
    urls:
      - "https://www.hrsd.gov.sa/sites/default/files/2023-02/Labor.pdf"
    manual_url: "https://www.hrsd.gov.sa/sites/default/files/2023-02/Labor.pdf"
    notes: "English translation published by HRSD. This edition may predate the amendments that took effect in February 2025; check the current consolidated text."

  - id: sa_pdpl
    jurisdiction: SA
    title: "Saudi Personal Data Protection Law, Royal Decree No. M/19 (amended by M/148)"
    short: "Saudi PDPL"
    kind: law
    language: en
    urls:
      - "https://sdaia.gov.sa/en/SDAIA/about/Documents/Personal%20Data%20English%20V2-23April2023-%20Reviewed-.pdf"
    manual_url: "https://sdaia.gov.sa/en/SDAIA/about/Pages/RegulationsAndPolicies.aspx"
    notes: "English translation published by SDAIA; the Arabic text prevails. Details are set out in the Implementing Regulations."

  - id: sa_pdpl_regulations
    jurisdiction: SA
    title: "Implementing Regulations of the Saudi Personal Data Protection Law"
    short: "Saudi PDPL Implementing Regulations"
    kind: regulation
    language: en
    urls:
      - "https://sdaia.gov.sa/en/SDAIA/about/Documents/ImplementingRegulation.pdf"
    manual_url: "https://sdaia.gov.sa/en/SDAIA/about/Pages/RegulationsAndPolicies.aspx"

  - id: sa_ai_ethics
    jurisdiction: SA
    title: "SDAIA AI Ethics Principles"
    short: "SDAIA AI Ethics Principles"
    kind: guidance
    language: en
    urls:
      - "https://sdaia.gov.sa/en/SDAIA/about/Documents/ai-principles.pdf"
    manual_url: "https://sdaia.gov.sa/en/SDAIA/about/Pages/RegulationsAndPolicies.aspx"
    notes: "Ethics framework, not a statute."

  - id: eu_ai_act
    jurisdiction: EU
    title: "Regulation (EU) 2024/1689 (Artificial Intelligence Act)"
    short: "EU AI Act"
    kind: law
    language: en
    urls:
      - "http://publications.europa.eu/resource/celex/32024R1689"
    accept: "application/xhtml+xml"
    manual_url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"
    notes: "Text as originally published in the Official Journal. Application dates are staggered and amendments have been proposed; check the consolidated version."

  - id: eu_gdpr
    jurisdiction: EU
    title: "Regulation (EU) 2016/679 (General Data Protection Regulation)"
    short: "GDPR"
    kind: law
    language: en
    urls:
      - "http://publications.europa.eu/resource/celex/32016R0679"
    accept: "application/xhtml+xml"
    manual_url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng"

jurisdictions:
  AE: { en: "United Arab Emirates", ar: "الإمارات العربية المتحدة" }
  SA: { en: "Saudi Arabia", ar: "المملكة العربية السعودية" }
  EU: { en: "European Union", ar: "الاتحاد الأوروبي" }
