# Weekly check that the indexed laws are still current.
# Previous downloads are kept in the Actions cache so each run can diff
# against the last one; change reports are uploaded as an artifact.
name: check-laws

on:
  schedule:
    - cron: "0 5 * * 1"  # Mondays 05:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/laws
          key: laws-${{ github.run_id }}
          restore-keys: laws-
      - name: Check sources for changes
        run: python scripts/check_updates.py
      - name: Verify curated content against the current texts
        run: |
          python scripts/build_index.py
          python scripts/verify_content.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: law-change-reports
          path: |
            data/laws/diffs/
            data/content_verification.json
          if-no-files-found: ignore
